name: Release · Website

# Deploys the website (workers/www, web/, admin/, api/, shared/) to Cloudflare when it changes on main, and when the public files it bundles change (public-watch.yml dispatches this).
# Runs in the tree of the public repo with this one laid over it (tools/tree.sh): the Worker imports the public validators (../../extension/...).
# Live at https://www.jobpilotto.top (Workers static assets, free).
# Secrets: CLOUDFLARE_API_TOKEN (template "Edit Cloudflare Workers"), CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'admin/**'
      - 'api/**'
      - 'shared/**'
      - 'workers/www/**'
      - 'db/migrations/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-deploy
  cancel-in-progress: false   # a started run finishes and the next waits: a cancelled run is a red cross on main (tests/test_main_runs_finish.py)

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SELFHEAL_PUBLISH_KEY: ${{ secrets.SELFHEAL_PUBLISH_KEY }}   # job-wide: a step's own env is not visible to its `if`
      AI_COST_PUBLISH_KEY: ${{ secrets.AI_COST_PUBLISH_KEY }}
      REPLAYS_PUBLISH_KEY: ${{ secrets.REPLAYS_PUBLISH_KEY }}
    steps:
      - name: Not set up yet
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::Add the CLOUDFLARE_API_TOKEN secret (Cloudflare → API Tokens → Edit Cloudflare Workers) to deploy the site."
      - uses: actions/checkout@v5
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          path: .private
      - name: Lay the public repo's tree under this one
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: .private/tools/tree.sh
      - uses: actions/setup-node@v5
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: '22'
      - name: "Database migrations (db/migrations: stats, app reports)"
        if: env.CLOUDFLARE_API_TOKEN != ''
        continue-on-error: true   # a token without D1 rights must not block the deploy; the warning says to apply by hand
        working-directory: workers/www
        run: |
          npx --yes wrangler@4 d1 migrations apply www-stats --remote \
            || { echo "::warning::D1 migrations not applied (the token needs D1 Edit). Apply: cd workers/www && npx wrangler@4 d1 migrations apply www-stats --remote"; exit 1; }
      - name: "R2 bucket of the Lab's fill videos (workers/www/wrangler.toml LAB_FILLS)"
        if: env.CLOUDFLARE_API_TOKEN != ''
        continue-on-error: true   # already there = fine; a token without R2 rights must not block the deploy, the warning says what to run
        working-directory: workers/www
        run: |
          npx --yes wrangler@4 r2 bucket info lab-fills >/dev/null 2>&1 || npx --yes wrangler@4 r2 bucket create lab-fills \
            || { echo "::warning::R2 bucket lab-fills not created (the token needs R2 Edit). Create: cd workers/www && npx wrangler@4 r2 bucket create lab-fills"; exit 1; }
      - name: Deploy to Cloudflare
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: workers/www
        run: ../../tools/cf-retry.sh npx --yes wrangler@4 deploy --config wrangler.toml
      # The key CI uses to publish the self-healing loop's numbers to /self-heal (self-heal-stats.yml); the Worker gets it from the GitHub secret.
      - name: The publish key of /self-heal
        if: env.CLOUDFLARE_API_TOKEN != '' && env.SELFHEAL_PUBLISH_KEY != ''
        working-directory: workers/www
        run: ../../tools/cf-retry.sh bash -c 'printf "%s" "$SELFHEAL_PUBLISH_KEY" | npx --yes wrangler@4 secret put SELFHEAL_PUBLISH_KEY --config wrangler.toml'
      # The key the scheduled jobs use to report their AI cost to /ai-cost (desktop/e2e/ai-cost-report.mjs).
      - name: The publish key of /ai-cost
        if: env.CLOUDFLARE_API_TOKEN != '' && env.AI_COST_PUBLISH_KEY != ''
        working-directory: workers/www
        run: ../../tools/cf-retry.sh bash -c 'printf "%s" "$AI_COST_PUBLISH_KEY" | npx --yes wrangler@4 secret put AI_COST_PUBLISH_KEY --config wrangler.toml'
      # The key CI uses to send the recorded replays of main to /admin/form-filling/lab (page-cases.yml, desktop/e2e/replays-report.mjs): it can write that table only.
      - name: The publish key of the Fixed-site replays
        if: env.CLOUDFLARE_API_TOKEN != '' && env.REPLAYS_PUBLISH_KEY != ''
        working-directory: workers/www
        run: ../../tools/cf-retry.sh bash -c 'printf "%s" "$REPLAYS_PUBLISH_KEY" | npx --yes wrangler@4 secret put REPLAYS_PUBLISH_KEY --config wrangler.toml'
