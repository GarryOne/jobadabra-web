name: Release · Bot Worker
# Deploys the Telegram bot Worker (`sre-job-pilotto-bot`: the bot and the on-time schedules) to Cloudflare. It was Release · Worker in the public repo (worker.yml, 10 Oct 2026, owner:
# "the worker should have a separate deployment pipeline"); moved here on 1 Nov 2026 (owner: "jobadabra should have no web, no worker" · "it should be strictly desktop and extension").
# The code is the public repo's app-core/src (the app runs it too); tools/tree.sh lays public main under this repo's files, so workers/bot/wrangler.toml bundles ../../app-core/src/index.js.
# Same Worker name, same crons, same bindings and secrets as before: a deploy does not touch the Worker's secrets, and the last step (workers/bot/scripts/check-secrets.mjs) is red when one is missing.
# Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID (the same as the other releases here).
# Why (1 Nov 2026, spec docs/superpowers/specs/2026-11-01-desktop-extension-only.md in the public repo, PR 3/6): by hand only until PR 4/6 switches the Worker over by day (the night burn-in
# starts its runs from this Worker's crons); two deployers of one Worker are never live at once. PR 4/6 adds the push trigger and the public-watch record.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bot-worker-deploy
  cancel-in-progress: false   # a started run finishes and the next waits: a cancelled run is a red cross on main (tests/test_main_runs_finish.py)
jobs:
  deploy:
    name: Deploy · Bot Worker
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}   # job-wide: a step's own env is not visible to its `if`
    steps:
      - name: Not set up yet
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::Add the CLOUDFLARE_API_TOKEN secret (Cloudflare → API Tokens → Edit Cloudflare Workers) to deploy the bot Worker."
      - uses: actions/checkout@v5
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          path: .private
      - name: Lay the public repo's tree under this one
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: .private/tools/tree.sh
      - uses: actions/setup-node@v5
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: '22'
      - name: Install
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: app-core
        run: npm ci
      - name: Tests · Worker
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: app-core
        run: npm test
      # `npm run deploy` = wrangler deploy, then check-secrets.mjs: red when the deployed Worker lacks a secret its schedules need (5 Oct 2026: a Worker created afresh had none).
      - name: Deploy to Cloudflare
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: workers/bot
        run: ../../tools/cf-retry.sh npm run deploy
