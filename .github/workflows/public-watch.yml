name: Release · Watch the public repo
# A deploy here bundles or builds from files of the public repo (the Worker imports ../../extension/recipe-schema.js, the Ready to send image builds hosted/ready-fill and extension/).
# The public repo cannot start a workflow here, so this one looks every hour: when those files changed since the last record (.public-site, .public-ready), it starts the deploy.
on:
  schedule:
    - cron: '7 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write   # the record files
  actions: write    # starts the two deploys

concurrency:
  group: public-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          path: .private
      - name: Lay the public repo's tree under this one
        run: .private/tools/tree.sh
      - name: Did the files a deploy bundles change
        id: change
        working-directory: .private
        run: |
          site=$(tools/public-watch.sh "$GITHUB_WORKSPACE" site app-core/src worker/src extension desktop/lib desktop/e2e/lib config)
          ready=$(tools/public-watch.sh "$GITHUB_WORKSPACE" ready hosted/ready-fill desktop/ready-fill extension app-core/src worker/src desktop/lib/form-address.js)
          echo "site=$site" >> "$GITHUB_OUTPUT"; echo "ready=$ready" >> "$GITHUB_OUTPUT"
          echo "public-watch: site $site, ready-to-send $ready"
      - name: Start the deploys that are behind, then record
        if: steps.change.outputs.site == 'changed' || steps.change.outputs.ready == 'changed'
        working-directory: .private
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ "${{ steps.change.outputs.site }}" = changed ] && gh workflow run site.yml
          [ "${{ steps.change.outputs.ready }}" = changed ] && gh workflow run release-ready-runner.yml
          git config user.name "site-watch"; git config user.email "site-watch@users.noreply.github.com"
          git add .public-site .public-ready 2>/dev/null || true
          git commit -q -m "Record the public files the last deploy was started for" && git push -q || true
