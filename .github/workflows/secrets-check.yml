name: CI · Secrets check
# Weekly: every secret and variable the workflows read (.github/expected-secrets.json) exists on this repo. Secrets do not move with a workflow (20 Oct 2026 site split: the draws, the search lab and its repair went red/skipped for 5 days unnoticed).
# Needs SECRETS_CHECK_TOKEN: a fine-grained token with "Secrets: read" and "Variables: read" on this repo only (the default token cannot list secrets). Without it the job only says so.
on:
  schedule:
    - cron: '41 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.SECRETS_CHECK_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: Compare the expected names with the repository's
        run: |
          [ -n "$GH_TOKEN" ] || { echo "::error::SECRETS_CHECK_TOKEN is not set: cannot list this repository's secrets"; exit 1; }
          have_s=$(gh secret list -R "$GITHUB_REPOSITORY" --json name --jq '.[].name' | sort)
          have_v=$(gh variable list -R "$GITHUB_REPOSITORY" --json name --jq '.[].name' | sort)
          want_s=$(jq -r '.secrets[]' .github/expected-secrets.json | sort)
          want_v=$(jq -r '.vars[]' .github/expected-secrets.json | sort)
          miss_s=$(comm -23 <(echo "$want_s") <(echo "$have_s")); miss_v=$(comm -23 <(echo "$want_v") <(echo "$have_v"))
          [ -z "$miss_s$miss_v" ] || { echo "::error::missing secrets: $(echo $miss_s); missing variables: $(echo $miss_v)"; exit 1; }
          echo "all expected secrets and variables exist"
