name: CI · E2E weekly summary
# The week's e2e numbers for the owner (spec rule D in the public repo, 28 Oct 2026): one GitHub issue here and one Telegram message on the CI alerts bot, drawn from the
# snapshot https://www.jobadabra.top/admin/testing/e2e draws (jobs/e2e-weekly.mjs; e2e-intel.yml refreshes it hourly). Replaces the public repo's e2e-weekly.yml.
on:
  schedule:
    - cron: '23 7 * * 1'   # Mondays 07:23 UTC, after e2e-intel's 06:41 and 07:41 refreshes have started
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: e2e-weekly
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      SELFHEAL_PUBLISH_KEY: ${{ secrets.SELFHEAL_PUBLISH_KEY }}
      CI_ALERTS_TELEGRAM_BOT_TOKEN: ${{ secrets.CI_ALERTS_TELEGRAM_BOT_TOKEN }}
      CI_ALERTS_TELEGRAM_CHAT_ID: ${{ secrets.CI_ALERTS_TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: .private
      - name: Lay the public repo's tree under this one
        run: .private/tools/tree.sh
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Post the weekly summary
        run: node jobs/e2e-weekly.mjs
