# RANDOM DRAW, DAILY (owner, 18 Oct 2026, "daily CI job"; every 2nd day from the first API draws ($1.69) until 26 Oct 2026, daily again on Free AI; Lab Job Search sketch https://claude.ai/artifact/7CCeNanG2kxhGqqRTCAQ3P).
# The search robot (owner, 26 Oct 2026: "why we don't find these gaps with our automatic tooling?"; sketch https://claude.ai/artifact/5PjZZy6TyTBNQZYB6PaofR): the draw is from everywhere
# (jobs/persona-search/draw_wide.py): any role kind of the app's list with a role the AI makes up, a city, country, region or remote place written as the wizard note, and a path:
# the first search, a field change then a 2nd search (run.mjs --change-field), or the same search again. A fictional CV, a fresh throwaway install (tools/persona-search/run.mjs
# on Free AI: its own temp folder, no Keychain/Notion/Telegram, telemetry and sharing off), and the counts, funnel and AI dollars go to /admin/lab-job-search "Random draws"
# (jobs/persona-search/draw-upload.mjs, main only). Daily (owner's yes, 26 Oct 2026, "about $25-40 a month at most"): measured on Free AI $0.05-0.16 a draw (mean $0.12,
# about $3.50 a month) and 14-33 Actions minutes (about 800 a month of the repo's ~4,000).
# - Synthetic only: nothing is read from or written to a real user's data; its rows are tagged CI and are never mixed with the Real installs tab.
# - AI: Free AI only (owner, 26 Oct 2026: "I don't want to top up anymore"): the site's handler on the runner on the draws' own Workers AI token (secrets
#   RANDOM_DRAWS_CF_*), production's per-install cap ($0.50 a draw); the job also stops at 45 minutes. OFF until the repository variable RANDOM_DRAWS_ON is "true".
# - Sites: data-centre IPs are refused by many boards; a refusal shows as "not reached" and is never retried or worked around (never past a login wall, captcha or 401/403/429).
# - A re-run of a bad day: Run workflow with that day's seed (YYYY-MM-DD), and the role it drew (draw.json in the artifact) to keep the same role.
# - The kept artifact is counts only (counts.json, draw.json): the search's top-10 job titles and source names stay out of it.
# Guard: tests/test_draw_wide.py, test/admin/search-lab-draws.test.js, test/jobs/search-alarm.test.js.
name: CI · Random draw (daily)

on:
  schedule:
    - cron: '30 4 * * *'   # daily (measured on Free AI, 26 Oct 2026)
  workflow_dispatch:
    inputs:
      seed:
        description: 'Seed, YYYY-MM-DD (empty: today, UTC)'
        type: string
        default: ''
      role:
        description: 'A fixed role title (a re-run of a gap, e.g. First Officer); empty: the AI makes one up'
        type: string
        default: ''
      public_ref:
        description: 'The public repo branch or full 40-character sha to draw on (a PR under test); empty: main'
        type: string
        default: ''
      engine:
        description: 'free (Free AI on the runner); api is parked (owner, 26 Oct 2026) and runs on Free AI'
        type: string
        default: ''

permissions:
  contents: read

# Scheduled draws queue one at a time; each hand-started draw runs on its own (26 Oct 2026: GitHub keeps one waiting run per group, so a second
# dispatch from another session silently cancelled a queued measurement).
concurrency:
  group: random-draw-${{ github.event_name == 'schedule' && 'schedule' || github.run_id }}
  cancel-in-progress: false

jobs:
  draw:
    if: github.event_name == 'workflow_dispatch' || vars.RANDOM_DRAWS_ON == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45   # a 2-search path takes about twice the first search's 15 minutes
    steps:
      - uses: actions/checkout@v5
        with:
          path: .private
      - name: Lay the public repo's tree under this one
        id: tree
        env:
          PUBLIC_REF: ${{ inputs.public_ref }}
        run: .private/tools/tree.sh --ref "${PUBLIC_REF:-main}"
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install the app
        working-directory: desktop
        run: npm ci
      - name: Stage the shared files the app imports (the worker's AI client)
        working-directory: desktop
        run: node scripts/stage.mjs --files-only
      - name: Python packages the engine needs
        run: pip install --quiet -r requirements.txt
      # Free AI only (owner, 26 Oct 2026: "Let's sjust switch to Free AI (CloudFlare workers AI). I don't want to top up anymore"): the site's Free AI handler
      # on this runner (jobs/persona-search/free-ai-local.mjs: Workers AI on the draws' own token, production's caps, its own meter, no Telegram, no web search
      # without its own key) answers both the draw's role and the search, reached like a Free AI user's app: a throwaway install's JPF1 key, the test-run base URL.
      # The API engine is parked. No Workers AI token: one line, no draw, never a red run.
      - name: Free AI on this runner
        id: free
        env:
          RANDOM_DRAWS_CF_ACCOUNT_ID: ${{ secrets.RANDOM_DRAWS_CF_ACCOUNT_ID }}
          RANDOM_DRAWS_CF_AI_TOKEN: ${{ secrets.RANDOM_DRAWS_CF_AI_TOKEN }}
        run: |
          set -o pipefail
          if [ -z "$RANDOM_DRAWS_CF_AI_TOKEN" ] || [ -z "$RANDOM_DRAWS_CF_ACCOUNT_ID" ]; then
            echo "Free AI: no token (secrets RANDOM_DRAWS_CF_AI_TOKEN, RANDOM_DRAWS_CF_ACCOUNT_ID): no draw today (the API engine is parked)" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "on=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          node jobs/persona-search/free-ai-local.mjs 8787 "$RUNNER_TEMP/free.key" > "$RUNNER_TEMP/free-ai.log" 2>&1 &
          for _ in $(seq 1 30); do grep -q listening "$RUNNER_TEMP/free-ai.log" && break; sleep 1; done
          grep -q listening "$RUNNER_TEMP/free-ai.log" || { cat "$RUNNER_TEMP/free-ai.log"; exit 1; }
          echo "on=true" >> "$GITHUB_OUTPUT"
      - name: Draw the candidate (any field, place and path; the AI names the role)
        id: draw
        if: steps.free.outputs.on == 'true'
        env:
          SEED_INPUT: ${{ inputs.seed }}
          ROLE_INPUT: ${{ inputs.role }}
          ENGINE_INPUT: ${{ inputs.engine }}
          ANTHROPIC_BASE_URL: http://127.0.0.1:8787/api/ai
        run: |
          set -o pipefail   # a failed draw must stop here, not as a missing draw.json in the next step
          seed="${SEED_INPUT:-$(date -u +%F)}"
          echo "seed=$seed" >> "$GITHUB_OUTPUT"
          if [ -n "$ENGINE_INPUT" ] && [ "$ENGINE_INPUT" != free ]; then echo "Engine $ENGINE_INPUT: parked (owner, 26 Oct 2026: \"I don't want to top up anymore\"): this draw runs on Free AI" | tee -a "$GITHUB_STEP_SUMMARY"; fi
          RANDOM_DRAWS_ANTHROPIC_KEY="$(cat "$RUNNER_TEMP/free.key")" python3 jobs/persona-search/draw_wide.py "$seed" "$RUNNER_TEMP/draw-out" --engines free ${ROLE_INPUT:+--role "$ROLE_INPUT"} | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Search as that candidate (live, the drawn path)
        if: steps.free.outputs.on == 'true'
        run: |
          set -o pipefail   # a crash in the harness must fail this step, not just the tee's exit
          folder="$RUNNER_TEMP/draw-out/draw"
          presses=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['presses'])" "$folder/draw.json")
          field=(); [ -f "$folder/field.json" ] && field=(--change-field "$folder/field.json")
          export RANDOM_DRAWS_ANTHROPIC_KEY="$(cat "$RUNNER_TEMP/free.key")" ANTHROPIC_BASE_URL=http://127.0.0.1:8787/api/ai JOB_PILOTTO_E2E=1 JOB_PILOTTO_E2E_AI_BASE_URL=http://127.0.0.1:8787/api/ai
          status=0   # a crashed search still reports what Free AI spent, then fails the step
          node tools/persona-search/run.mjs draw "$RUNNER_TEMP/draw-out" --presses "$presses" --note "$folder/note.txt" "${field[@]}" --engine api --fresh 2>&1 | tee "$RUNNER_TEMP/draw.log" || status=$?
          curl -sf http://127.0.0.1:8787/__report > "$folder/free-ai.json"
          node -e "const fs=require('fs');const [d,f]=process.argv.slice(1);const draw=JSON.parse(fs.readFileSync(d));draw.free_ai=JSON.parse(fs.readFileSync(f));fs.writeFileSync(d,JSON.stringify(draw))" "$folder/draw.json" "$folder/free-ai.json"
          echo "Free AI: $(cat "$folder/free-ai.json")" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Send the counts to /admin
        if: github.ref == 'refs/heads/main' && steps.free.outputs.on == 'true'
        env:
          REPLAYS_PUBLISH_KEY: ${{ secrets.REPLAYS_PUBLISH_KEY }}
        run: node jobs/persona-search/draw-upload.mjs "$RUNNER_TEMP/draw-out" --build "$PUBLIC_SHA" --branch main --answer "$RUNNER_TEMP/verdict.json"
      # The search robot's alarm (jobs/persona-search/draw-alarm.mjs): 0 relevant jobs, a crash, or a floor from the draws' own numbers files or updates one issue per
      # field × place × path in the app repo (GarryOne/jobadabra, "[auto-search] ..."); a passing draw closes it. The CI GitHub App's token, Issues only.
      - name: The app repo's token for the alarm
        id: alarm_token
        if: always() && github.ref == 'refs/heads/main'
        continue-on-error: true   # no token: the alarm prints what it would file (below), never a red job
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: GarryOne
          repositories: jobadabra
          permission-issues: write
      - name: Alarm when the search came back thin
        if: always() && steps.tree.outcome == 'success'   # no tree, no scripts: nothing to judge
        env:
          GH_TOKEN: ${{ steps.alarm_token.outputs.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -o pipefail
          [ -f "$RUNNER_TEMP/draw-out/draw/presses.jsonl" ] || { echo "no search ran: nothing to judge"; exit 0; }
          if [ -n "$GH_TOKEN" ]; then node jobs/persona-search/draw-alarm.mjs "$RUNNER_TEMP/draw-out" --verdict "$RUNNER_TEMP/verdict.json" --run "$RUN_URL" | tee -a "$GITHUB_STEP_SUMMARY"
          else node jobs/persona-search/draw-alarm.mjs "$RUNNER_TEMP/draw-out" --verdict "$RUNNER_TEMP/verdict.json" --run "$RUN_URL" --dry | tee -a "$GITHUB_STEP_SUMMARY"; fi
      - name: Alarm when real installs' searches came back empty (3+ installs per field × country)
        if: always() && steps.tree.outcome == 'success'   # no tree, no scripts: a red step that says nothing (26 Oct 2026)
        env:
          GH_TOKEN: ${{ steps.alarm_token.outputs.token }}
          REPLAYS_PUBLISH_KEY: ${{ secrets.REPLAYS_PUBLISH_KEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -o pipefail
          [ -n "$REPLAYS_PUBLISH_KEY" ] || { echo "no key: real installs not read"; exit 0; }
          if [ -n "$GH_TOKEN" ]; then node jobs/persona-search/real-alarm.mjs --run "$RUN_URL" | tee -a "$GITHUB_STEP_SUMMARY"
          else node jobs/persona-search/real-alarm.mjs --run "$RUN_URL" --dry | tee -a "$GITHUB_STEP_SUMMARY"; fi
      - name: Keep the numbers (counts only, no job titles, companies or log)
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/keep"
          cp "$RUNNER_TEMP/draw-out/draw/draw.json" "$RUNNER_TEMP/keep/" || true
          node -e "const fs=require('fs');const f=process.argv[1];if(!fs.existsSync(f))process.exit(0);const rows=fs.readFileSync(f,'utf8').split('\\n').filter(Boolean).map(line=>{const row=JSON.parse(line);for(const key of ['top10','sources','local_by_source'])delete row[key];return row});fs.writeFileSync(process.argv[2],JSON.stringify(rows))" "$RUNNER_TEMP/draw-out/draw/presses.jsonl" "$RUNNER_TEMP/keep/counts.json"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: random-draw-${{ steps.draw.outputs.seed }}
          path: ${{ runner.temp }}/keep
          retention-days: 30
