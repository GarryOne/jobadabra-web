name: CI · Ops overview
# Where our engineering time goes (owner, 15 Oct 2026): the merged PRs of the last 30 days, by what they change, for https://www.jobpilotto.top/admin/agents/overview.
# Pushed by build.yml (CI · Tests) after every merge to main (its last step) and hourly here as the backup; each PR is read once (jobs/ops-overview.mjs); the site keeps one row per PR and one snapshot row.
# Why a workflow and not the page reading GitHub: a page load would spend GitHub calls and D1 reads each time; here one write per PR, one row read per page.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: ops-overview-${{ github.sha }}   # a push gets its own group (tests/test_workflow_contract.py); a repeat is harmless: a PR is stored once
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: GarryOne/jobadabra   # the public repo's PRs, runs and tags (read with this repo's token: public data)
      SELFHEAL_PUBLISH_KEY: ${{ secrets.SELFHEAL_PUBLISH_KEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: .private
      - name: Lay the public repo's tree under this one
        run: .private/tools/tree.sh
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Read the new merged PRs and publish them
        run: node jobs/ops-overview.mjs
