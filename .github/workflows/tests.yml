name: CI · Tests
# The site's own tests, the tests that live in this repo, and the public repo's tests that read site files, in a tree of the public repo with this repo's files laid over it (tools/tree.sh).
# Runs on every push and pull request here, and once a day against the newest public main: a public change that drifts from the site fails here the next morning.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]   # edited: the description is checked, so fixing it re-runs the check
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read   # the PR's changed files: media tests run only when it touches media

concurrency:
  group: tests-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: All checks passed
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      JOBADABRA_FOLLOW_APP: '0'
      JOBADABRA_DISABLE: mail,notion,telegram,google_jobs
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          path: .private
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Lay the public repo's tree under this one
        run: .private/tools/tree.sh
      - run: pip install -r requirements.txt
      - run: npm ci
        working-directory: desktop
      - name: Does this PR touch media?   # no: skip ffmpeg, Electron and the media tests (a stalled mirror failed a migration-only PR 4 times, 26 Oct 2026); main and the daily run always run them
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          files="$(gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --jq '.[].filename')" || files='ops/media/'
          if printf '%s\n' "$files" | grep -qE '^(ops/media/|test/desktop/media-|tools/(hero|media|apt-install|site-guards)|\.github/workflows/tests\.yml$)'; then echo MEDIA_TOOLS=1; else echo MEDIA_TOOLS=0; fi | tee -a "$GITHUB_ENV"
      - name: ffmpeg for the hero media tests   # #98: framesIn and the plan check make and read small videos (test/desktop/media-*.test.js, joined tree: desktop/test/); cut and retried, never a hang (web #122: 11m51s)
        if: github.event_name != 'pull_request' || env.MEDIA_TOOLS == '1'   # unset on a push reads as 0 here, so compare with '1' (red main 9908c69)
        timeout-minutes: 5
        run: .private/tools/apt-install.sh ffmpeg
      - name: Electron and a display for the hero render test   # #100: media-render.test.js draws frames with media/render.cjs; the job skips the binary above
        if: github.event_name != 'pull_request' || env.MEDIA_TOOLS == '1'   # unset on a push reads as 0 here, so compare with '1' (red main 9908c69)
        timeout-minutes: 8
        working-directory: desktop
        run: ../.private/tools/apt-install.sh xvfb && ELECTRON_SKIP_BINARY_DOWNLOAD='' node node_modules/electron/install.js
      - name: PR description laid out
        if: github.event_name == 'pull_request'
        env:
          BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ endsWith(github.actor, '[bot]') && '' || github.event.pull_request.title }}   # the "[xx] " session tag (public tools/pr-body-check.py)
        run: printf '%s' "$BODY" | python3 tools/pr-body-check.py   # the public repo's own check, from the joined tree: the same layout the owner reads in 2-5 seconds
      - name: playwright-core for the phone checks   # test/admin/admin-no-sideways.test.js, test/web/no-sideways.test.js (390 px) and test/admin/palette-pages.test.js (⌘K) open pages in the runner's Google Chrome; without it they skip (26 Oct 2026, admin on a phone)
        timeout-minutes: 3
        run: |
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" playwright-core@1.63.0
          echo "PLAYWRIGHT_CORE=$RUNNER_TEMP/pw/node_modules/playwright-core" >> "$GITHUB_ENV"
          echo "CHROME=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Site tests
        env:
          SITE_ROUTES_STRICT: ${{ github.event_name == 'schedule' && '1' || '' }}   # a route the Worker has but public never listed fails the daily run, not a pair in flight
        run: bash tools/check.sh --area site
      - name: Tests that read site files, and the tests of this repo
        run: if [ "${MEDIA_TOOLS:-1}" = 0 ]; then bash .private/tools/site-guards.sh . .private; else xvfb-run -a bash .private/tools/site-guards.sh . .private; fi   # a display for Electron (the render test)
