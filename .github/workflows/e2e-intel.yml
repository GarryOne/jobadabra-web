name: CI · E2E intelligence
# Why e2e goes red (owner, 18 Oct 2026; every run kind and a cause for every red, 27 Oct 2026), for https://www.jobpilotto.top/admin/operations/e2e: every finished e2e run
# (beta, nightly, main after merge, scheduled, soak, PR, the daily harness tests) and the cause of each red suite (jobs/e2e-intel.mjs: facts, then the fix's E2E-cause trailer,
# then a small Workers AI call on its OWN token, never production's: E2E_CAUSE_CF_TOKEN / E2E_CAUSE_CF_ACCOUNT; without them those reds stay "unknown").
# Runs hourly (the public repo cannot start a workflow here) (a red's cause "open" becomes "test" or "product" once its fix has run); each run is read once, the site keeps one row per run and one snapshot row.
# Why (31 Oct 2026): the title says who started the run, so an on-time Worker start (shared/intel-start.js) and GitHub's late backup can be told apart on the Actions page.
run-name: E2E intelligence · ${{ github.event_name == 'workflow_dispatch' && 'on time (Worker timer)' || 'GitHub schedule' }}

on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: e2e-intel
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: GarryOne/jobadabra   # the public repo's PRs, runs and tags (read with this repo's token: public data)
      SELFHEAL_PUBLISH_KEY: ${{ secrets.SELFHEAL_PUBLISH_KEY }}
      E2E_CAUSE_CF_TOKEN: ${{ secrets.E2E_CAUSE_CF_TOKEN }}
      E2E_CAUSE_CF_ACCOUNT: ${{ secrets.E2E_CAUSE_CF_ACCOUNT }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: .private
      - name: Lay the public repo's tree under this one
        run: .private/tools/tree.sh
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Read the new runs and publish them
        run: node jobs/e2e-intel.mjs
