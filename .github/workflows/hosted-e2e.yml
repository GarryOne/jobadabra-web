name: CI · Hosted Always on e2e
# Zero-setup Always on end to end (spec docs/superpowers/specs/2026-10-16-hosted-always-on.md step 7; owner, 17 Oct 2026): a fresh install with no Notion, keys or GitHub turns Always on on,
# the cron tick queues a run, the real hosted image runs in Docker against fixture feeds, AI goes through the Worker's /api/ai to a fake model, the debit and the digest e-mail are checked,
# the app pulls the matches into its own store, Turn off deletes everything, a used-up trial pauses with the functional notice. Everything Cloudflare is an in-process fake: $0, no secrets.
# A merge to main that touches the site's hosted code starts it (GitHub's `paths:`); also every night, against the newest public main (the hosted image and engine are public). Not a required check (a `paths:` skip never reports).
# Why (2 Nov 2026, owner: "No e2e on PRs", 1 Nov 2026; asked "why we need this e2e on this PR?" on #312): this runs the real hosted image in Docker (~6 min), so it is an e2e, not an integration test:
# PRs run unit + integration only; e2e runs after each merge on main (a red merge is reverted) and every night. It stood on every PR touching shared/free-ai.js, and the one red it gave on #312 was not that PR's
# (public #2926 had renamed the engine's JOB_PILOTTO_FIXTURE_DIR to JOBADABRA_FIXTURE_DIR; the old base still passed the old name, so the engine left fixture mode and crawled the real employer sites).
on:
  push:
    branches: [main]
    paths:
      - 'api/hosted*'
      - 'shared/hosted*'
      - 'shared/free-ai.js'
      - 'shared/mail*.js'
      - 'ops/db/migrations/**'
      - 'ops/jobs/hosted-e2e/**'
      - '.github/workflows/hosted-e2e.yml'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosted-e2e-${{ github.run_id }}   # one group per run: every merge to main is run, none is replaced by a newer one
  cancel-in-progress: false

jobs:
  hosted-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          path: .private
      - name: Lay the public repo's tree under this one
        run: .private/tools/tree.sh
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: The app side (its own engine, for the merge into the Jobs store)
        run: pip install -r requirements.txt
      - run: npm ci
        working-directory: desktop
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: node desktop/scripts/stage.mjs
      - name: Run the scenario against the real hosted image
        env:
          HOSTED_E2E_RUNNER: docker
        shell: bash   # -eo pipefail: a failing job behind `| tee` fails the step (default bash -e returns tee's status)
        run: node jobs/hosted-e2e/run.mjs 2>&1 | tee hosted-e2e.log
      - name: The scenario's steps
        if: always()
        run: grep '^hosted-e2e:' hosted-e2e.log || true
