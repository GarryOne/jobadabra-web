# Added after the owner's ask (1 Nov 2026: "we don't have the functionality of GH labels (conflicts) for this repository. let's add").
# Puts an orange "Merge conflict" label on each open PR that GitHub says conflicts with its base, and takes it off once it merges cleanly (owner, 30 Oct 2026).
# Runs on a push to main (any open PR may now conflict) and on a PR push (it may be fixed); NEVER runs a PR's code; its only writes are labels.
# Why (2 Nov 2026, owner: "same workflow on all repos"): the script is NOT copied here: the checkout reads tools/conflict-label.mjs from the public jobadabra/jobadabra main, one parser for every repo.
# Script and cases: jobadabra/jobadabra tools/conflict-label.mjs, tests/test_conflict_label.py. This repo's guard: test/tools/pr-label-workflows.test.js.
# A label, not a gate (owner, 1 Nov 2026): no required check waits for it and nothing blocks a merge. The job is named `conflict`, not `label`, so it never reads as the Gitar label check ("CI · Gitar label").
name: CI · Conflict label

on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write   # creating the label the first time (addLabel in tools/conflict-label.mjs)

# Why (30 Oct 2026): on main the newest push's run decides (jobadabra's tests/test_main_runs_finish.py) and reads every open PR anyway; a PR push's run is its own group,
# never cancelled, since a cancelled run is drawn as a failed check on that PR (#2400).
concurrency:
  group: conflict-label-${{ github.event_name == 'push' && 'main' || github.run_id }}
  cancel-in-progress: true

jobs:
  conflict:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          repository: jobadabra/jobadabra   # the script lives there (public), not in this repo
          ref: main
          # Why (2 Nov 2026, owner: "red"): conflict-label.mjs imports ./gitar-label.mjs, so both are fetched; one missing was ERR_MODULE_NOT_FOUND on every web PR.
          # No comment inside the block below: a YAML block scalar has none, it would become part of the pattern (Gitar on web#307).
          sparse-checkout: |
            tools/conflict-label.mjs
            tools/gitar-label.mjs
          sparse-checkout-cone-mode: false   # a file pattern, not a directory (cone mode would read the path as a folder; Gitar on web#258)
      - name: Label the open PRs that conflict
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}   # empty on a push to main: every open PR
        run: node tools/conflict-label.mjs
