name: Release · Codex broker
# Deploys the Codex broker Worker and its container image (workers/codex-broker) when they change on main. The broker holds the owner's one ChatGPT/Codex login and runs every CI, scheduled and
# benchmark AI call (spec docs/superpowers/specs/2026-10-28-ci-on-codex-subscription-design.md in the public repo). Same secrets as Release · Ready to send runner. The image holds no secret; the login lives in the Durable Object.
# Why (28 Oct 2026, owner): CI on Free AI billed ~$4/day of neurons unseen; the owner bought a Codex plan and wants CI on it.
on:
  push:
    branches: [main]
    paths:
      - 'workers/codex-broker/**'
      - '.github/workflows/release-codex-broker.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: codex-broker-deploy
  cancel-in-progress: false   # a started run finishes and the next waits: a cancelled run is a red cross on main (tests/test_main_runs_finish.py)
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Not set up yet
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::Add the CLOUDFLARE_API_TOKEN secret to deploy the Codex broker."
      - uses: actions/checkout@v5
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          path: .private
      - name: Lay the public repo's tree under this one
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: .private/tools/tree.sh
      - uses: actions/setup-node@v5
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: '22'
      - name: The broker's own tests first
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: node --test test/codex-broker/*.test.js
      - name: Deploy the broker and its image
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: workers/codex-broker
        run: npm install --no-audit --no-fund && ../../tools/cf-retry.sh npx --yes wrangler@4 deploy
